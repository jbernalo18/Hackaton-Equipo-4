
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras | Trendy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">Trendy</h1>
            <a href="index.html" class="btn btn-outline-light">
                Seguir comprando
            </a>
        </div>
    </header>

    <main class="container my-5">
        <h2 class="mb-4">Mi carrito de compras</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-hover bg-white align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Imagen</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="lista-carrito">
                    <!-- Los productos aparecerán aquí -->
                </tbody>
            </table>
        </div>

        <div id="carrito-vacio" class="alert alert-info d-none">
            Tu carrito está vacío.
        </div>

        <div class="text-end mt-4">
            <h3>Total: <span id="total-carrito">$0</span></h3>

            <button id="vaciar-carrito" class="btn btn-outline-danger mt-2">
                Vaciar carrito
            </button>

            <button class="btn btn-success mt-2">
                Finalizar compra
            </button>
        </div>
    </main>

    <script type="module" src="./carrito.js"></script>
</body>
</html>
